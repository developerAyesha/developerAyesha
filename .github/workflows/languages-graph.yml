name: Languages Graph Generator
on:
  schedule:
    - cron: "17 4 * * *"   # Daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-languages-graph:
    runs-on: ubuntu-latest
    name: Generate Programming Languages Chart
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Languages SVG Chart
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import sys
          import json
          import requests
          from typing import Dict, List, Tuple

          # Configuration
          TOKEN = os.environ.get("GH_TOKEN")
          if not TOKEN:
              print("Error: Missing GH_TOKEN environment variable")
              sys.exit(1)

          API_ENDPOINT = "https://api.github.com/graphql"
          HEADERS = {"Authorization": f"Bearer {TOKEN}"}
          IGNORED_LANGUAGES = {"Jupyter Notebook", "Dockerfile", "Makefile"}
          MIN_PERCENTAGE_THRESHOLD = 1.0
          MAX_LANGUAGES_DISPLAY = 8

          # Colors for "Most Used Languages" card (match reference design)
          LANGUAGE_COLORS = {
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "HTML": "#E34F26",
              "CSS": "#563D7C",
              "Python": "#3776AB",
              "Java": "#ED8B00",
              "C++": "#00599C",
              "C": "#A8B9CC",
              "C#": "#239120",
              "Go": "#00ADD8",
              "Rust": "#CE422B",
              "Ruby": "#CC342D",
              "PHP": "#777BB4",
              "Swift": "#F05138",
              "Kotlin": "#7F52FF",
              "Vue": "#41B883",
              "Shell": "#89E051",
              "Other": "#8B949E",
          }

          def fetch_language_data() -> Dict[str, int]:
              """Fetch language data from all accessible repositories."""
              lang_sizes = {}
              after = None
              
              query = """
              query($after: String) {
                viewer {
                  repositories(
                    first: 100, 
                    after: $after, 
                    affiliations: [OWNER, ORGANIZATION_MEMBER, COLLABORATOR], 
                    isFork: false, 
                    orderBy: {field: UPDATED_AT, direction: DESC}
                  ) {
                    pageInfo { 
                      hasNextPage 
                      endCursor 
                    }
                    nodes {
                      languages(first: 100, orderBy: {field: SIZE, direction: DESC}) {
                        edges { 
                          size 
                          node { name } 
                        }
                      }
                    }
                  }
                }
              }
              """

              while True:
                  try:
                      response = requests.post(
                          API_ENDPOINT, 
                          json={"query": query, "variables": {"after": after}}, 
                          headers=HEADERS, 
                          timeout=60
                      )
                      response.raise_for_status()
                      data = response.json()
                      
                      if "errors" in data:
                          print(f"GraphQL errors: {data['errors']}")
                          sys.exit(1)
                          
                      repos = data["data"]["viewer"]["repositories"]
                      
                      for repo in repos["nodes"]:
                          for edge in repo["languages"]["edges"]:
                              language_name = edge["node"]["name"]
                              if language_name not in IGNORED_LANGUAGES:
                                  lang_sizes[language_name] = lang_sizes.get(language_name, 0) + int(edge["size"])
                      
                      if not repos["pageInfo"]["hasNextPage"]:
                          break
                      after = repos["pageInfo"]["endCursor"]
                      
                  except requests.exceptions.RequestException as e:
                      print(f"Request failed: {e}")
                      sys.exit(1)
              
              return lang_sizes

          def process_language_data(lang_sizes: Dict[str, int]) -> List[Tuple[str, float]]:
              """Process language data and calculate percentages."""
              if not lang_sizes:
                  return []
              
              # Sort by size and calculate percentages
              items = sorted(lang_sizes.items(), key=lambda x: x[1], reverse=True)
              total_size = sum(size for _, size in items)
              percentages = [(name, (size / total_size) * 100.0) for name, size in items]
              
              # Separate major languages and aggregate small ones
              major_languages = [(name, pct) for name, pct in percentages if pct >= MIN_PERCENTAGE_THRESHOLD]
              other_percentage = sum(pct for _, pct in percentages if pct < MIN_PERCENTAGE_THRESHOLD)
              
              if other_percentage > 0:
                  major_languages.append(("Other", other_percentage))
              
              return major_languages[:MAX_LANGUAGES_DISPLAY]

          def escape_html(text: str) -> str:
              """Escape HTML special characters."""
              return text.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')

          def get_language_color(lang: str) -> str:
              return LANGUAGE_COLORS.get(lang, "#8B949E")

          def generate_svg(languages: List[Tuple[str, float]]) -> str:
              """Generate 'Most Used Languages' card: black bg, matches stats card width (495), dynamic percentages from API."""
              CARD_BG = "#000000"
              CARD_BORDER = "#6B7280"
              TITLE_COLOR = "#F44391"
              TEXT_COLOR = "#FFFFFF"
              WIDTH = 495
              PADDING = 24
              TITLE_SIZE = 18
              BAR_HEIGHT = 14
              BAR_Y = 52
              LIST_ITEM_HEIGHT = 24
              DOT_SIZE = 8
              LIST_START_Y = 82
              ROW_GAP = 4

              if not languages:
                  empty_parts = []
                  empty_parts.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{WIDTH}" height="120" viewBox="0 0 {WIDTH} 120">')
                  empty_parts.append(f'<rect width="100%" height="100%" rx="10" fill="{CARD_BG}" stroke="{CARD_BORDER}" stroke-width="1"/>')
                  empty_parts.append(f'<text x="{PADDING}" y="45" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="{TITLE_SIZE}" font-weight="700" fill="{TITLE_COLOR}">Most Used Languages</text>')
                  empty_parts.append(f'<text x="{PADDING}" y="75" font-family="system-ui,sans-serif" font-size="14" fill="{TEXT_COLOR}">No language data available</text>')
                  empty_parts.append('</svg>')
                  return ''.join(empty_parts)

              # List layout: up to 2 columns
              n = len(languages)
              col2_start = (n + 1) // 2
              list_height = (max(col2_start, n - col2_start) * (LIST_ITEM_HEIGHT + ROW_GAP)) + PADDING
              HEIGHT = int(LIST_START_Y + list_height)

              parts = []
              parts.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}">')
              parts.append(f'<rect width="100%" height="100%" rx="10" fill="{CARD_BG}" stroke="{CARD_BORDER}" stroke-width="1"/>')
              parts.append(f'<text x="{PADDING}" y="38" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="{TITLE_SIZE}" font-weight="700" fill="{TITLE_COLOR}">Most Used Languages</text>')

              # Single horizontal progress bar (rounded caps) with segments
              bar_left = PADDING
              bar_width = WIDTH - 2 * PADDING
              parts.append(f'<defs><clipPath id="barClip"><rect x="{bar_left}" y="{BAR_Y}" width="{bar_width}" height="{BAR_HEIGHT}" rx="{BAR_HEIGHT//2}" ry="{BAR_HEIGHT//2}"/></clipPath></defs>')
              parts.append(f'<rect x="{bar_left}" y="{BAR_Y}" width="{bar_width}" height="{BAR_HEIGHT}" rx="{BAR_HEIGHT//2}" ry="{BAR_HEIGHT//2}" fill="#0a0a0a"/>')
              parts.append('<g clip-path="url(#barClip)">')
              x = bar_left
              for lang_name, pct in languages:
                  seg_width = max(2, (bar_width * pct) / 100.0)
                  color = get_language_color(lang_name)
                  parts.append(f'<rect x="{x:.2f}" y="{BAR_Y}" width="{seg_width:.2f}" height="{BAR_HEIGHT}" fill="{color}"/>')
                  x += seg_width
              parts.append('</g>')

              # List: colored dot + "Language XX.XX%"
              for i, (lang_name, pct) in enumerate(languages):
                  color = get_language_color(lang_name)
                  if i < col2_start:
                      row, col = i, 0
                  else:
                      row, col = i - col2_start, 1
                  y = LIST_START_Y + row * (LIST_ITEM_HEIGHT + ROW_GAP) + (LIST_ITEM_HEIGHT // 2)
                  x_dot = PADDING + (col * (WIDTH // 2))
                  x_text = x_dot + DOT_SIZE + 8
                  parts.append(f'<circle cx="{x_dot + DOT_SIZE//2}" cy="{y}" r="{DOT_SIZE//2}" fill="{color}"/>')
                  parts.append(f'<text x="{x_text}" y="{y}" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="{TEXT_COLOR}" dominant-baseline="middle">{escape_html(lang_name)} {pct:.2f}%</text>')

              parts.append('</svg>')
              return ''.join(parts)

          def main():
              """Main execution function."""
              print("Fetching language data from GitHub repositories...")
              language_data = fetch_language_data()
              
              if not language_data:
                  print("No language data found. Creating placeholder SVG.")
                  svg_content = generate_svg([])
              else:
                  print(f"Found {len(language_data)} languages. Processing data...")
                  processed_languages = process_language_data(language_data)
                  print(f"Generating chart for {len(processed_languages)} languages.")
                  svg_content = generate_svg(processed_languages)
              
              # Write SVG file
              with open("languages.svg", "w", encoding="utf-8") as f:
                  f.write(svg_content)
              
              print("Successfully generated languages.svg")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add and commit changes
          git add languages.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update programming languages chart"
            git push
            echo "Successfully updated languages.svg"
          fi
