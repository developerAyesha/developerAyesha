name: Languages Graph Generator
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/languages-graph.yml

permissions:
  contents: write

jobs:
  generate-languages-graph:
    runs-on: ubuntu-latest
    name: Generate Programming Languages Chart
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Languages SVG Chart
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import sys
          import requests
          from typing import Dict, List, Tuple

          # Configuration
          TOKEN = os.environ.get("GH_TOKEN")
          if not TOKEN:
              print("Error: Missing GH_TOKEN environment variable")
              sys.exit(1)

          API_ENDPOINT = "https://api.github.com/graphql"
          HEADERS = {"Authorization": f"Bearer {TOKEN}"}
          IGNORED_LANGUAGES = {"HTML", "CSS", "Jupyter Notebook", "Dockerfile", "Makefile", "Shell"}
          MIN_PERCENTAGE_THRESHOLD = 2.0
          MAX_LANGUAGES_DISPLAY = 8

          # Color palette for languages (indigo/purple theme)
          LANGUAGE_COLORS = {
              "TypeScript": "#3178c6",
              "JavaScript": "#f7df1e",
              "Python": "#3776ab",
              "Java": "#ed8b00",
              "Go": "#00add8",
              "Rust": "#dea584",
              "C++": "#f34b7d",
              "C": "#555555",
              "Ruby": "#cc342d",
              "PHP": "#777bb4",
              "Swift": "#fa7343",
              "Kotlin": "#7f52ff",
              "Dart": "#00b4ab",
              "Scala": "#dc322f",
              "Other": "#6b7280",
          }

          def get_language_color(lang: str) -> str:
              """Get color for a language, with fallback."""
              return LANGUAGE_COLORS.get(lang, "#818cf8")

          def fetch_language_data() -> Dict[str, int]:
              """Fetch language data from all accessible repositories."""
              lang_sizes = {}
              after = None
              
              query = """
              query($after: String) {
                viewer {
                  repositories(
                    first: 100, 
                    after: $after, 
                    affiliations: [OWNER, ORGANIZATION_MEMBER, COLLABORATOR], 
                    isFork: false, 
                    orderBy: {field: UPDATED_AT, direction: DESC}
                  ) {
                    pageInfo { 
                      hasNextPage 
                      endCursor 
                    }
                    nodes {
                      languages(first: 100, orderBy: {field: SIZE, direction: DESC}) {
                        edges { 
                          size 
                          node { name } 
                        }
                      }
                    }
                  }
                }
              }
              """

              while True:
                  try:
                      response = requests.post(
                          API_ENDPOINT, 
                          json={"query": query, "variables": {"after": after}}, 
                          headers=HEADERS, 
                          timeout=60
                      )
                      response.raise_for_status()
                      data = response.json()
                      
                      if "errors" in data:
                          print(f"GraphQL errors: {data['errors']}")
                          sys.exit(1)
                          
                      repos = data["data"]["viewer"]["repositories"]
                      
                      for repo in repos["nodes"]:
                          for edge in repo["languages"]["edges"]:
                              language_name = edge["node"]["name"]
                              if language_name not in IGNORED_LANGUAGES:
                                  lang_sizes[language_name] = lang_sizes.get(language_name, 0) + int(edge["size"])
                      
                      if not repos["pageInfo"]["hasNextPage"]:
                          break
                      after = repos["pageInfo"]["endCursor"]
                      
                  except requests.exceptions.RequestException as e:
                      print(f"Request failed: {e}")
                      sys.exit(1)
              
              return lang_sizes

          def process_language_data(lang_sizes: Dict[str, int]) -> List[Tuple[str, float]]:
              """Process language data and calculate percentages."""
              if not lang_sizes:
                  return []
              
              items = sorted(lang_sizes.items(), key=lambda x: x[1], reverse=True)
              total_size = sum(size for _, size in items)
              percentages = [(name, (size / total_size) * 100.0) for name, size in items]
              
              major_languages = [(name, pct) for name, pct in percentages if pct >= MIN_PERCENTAGE_THRESHOLD]
              other_percentage = sum(pct for _, pct in percentages if pct < MIN_PERCENTAGE_THRESHOLD)
              
              if other_percentage > 0:
                  major_languages.append(("Other", other_percentage))
              
              return major_languages[:MAX_LANGUAGES_DISPLAY]

          def generate_svg(languages: List[Tuple[str, float]]) -> str:
              """Generate a polished SVG chart with dark/light mode support."""
              if not languages:
                  return '''<svg xmlns="http://www.w3.org/2000/svg" width="800" height="80">
                      <style>
                          :root { --bg: #ffffff; --text: #1f2328; }
                          @media (prefers-color-scheme: dark) { :root { --bg: #0f0f23; --text: #e4e4f0; } }
                      </style>
                      <rect width="100%" height="100%" fill="var(--bg)" rx="12"/>
                      <text x="400" y="45" font-family="system-ui, sans-serif" font-size="14" fill="var(--text)" text-anchor="middle">
                          No language data available
                      </text>
                  </svg>'''
              
              WIDTH = 900
              HEIGHT = 80 + (len(languages) * 44) + 60
              BAR_HEIGHT = 28
              BAR_GAP = 16
              LEFT_MARGIN = 140
              RIGHT_MARGIN = 80
              TOP_MARGIN = 60
              
              chart_width = WIDTH - LEFT_MARGIN - RIGHT_MARGIN
              max_percentage = max(pct for _, pct in languages)
              
              svg_parts = [f'''<svg xmlns="http://www.w3.org/2000/svg" width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}">
          <defs>
              <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
              </linearGradient>
              <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
              </filter>
          </defs>
          <style>
              :root {{
                  --bg: #ffffff;
                  --card-bg: #f8fafc;
                  --text: #1e1b4b;
                  --text-muted: #6b7280;
                  --border: #e5e7eb;
                  --accent: #6366f1;
              }}
              @media (prefers-color-scheme: dark) {{
                  :root {{
                      --bg: #0f0f23;
                      --card-bg: #1a1a3e;
                      --text: #e4e4f0;
                      --text-muted: #9ca3af;
                      --border: #2d2d5a;
                      --accent: #818cf8;
                  }}
              }}
              text {{
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
              }}
              .title {{
                  font-weight: 600;
                  font-size: 18px;
                  fill: var(--text);
              }}
              .label {{
                  font-size: 13px;
                  font-weight: 500;
                  fill: var(--text);
              }}
              .value {{
                  font-size: 12px;
                  font-weight: 600;
                  fill: var(--text);
              }}
              .footer {{
                  font-size: 11px;
                  fill: var(--text-muted);
              }}
          </style>
          
          <!-- Background -->
          <rect x="0" y="0" width="{WIDTH}" height="{HEIGHT}" rx="16" fill="var(--bg)"/>
          <rect x="16" y="16" width="{WIDTH - 32}" height="{HEIGHT - 32}" rx="12" fill="var(--card-bg)" filter="url(#shadow)"/>
          
          <!-- Title -->
          <text x="{LEFT_MARGIN}" y="48" class="title">Programming Languages</text>
          ''']
              
              for i, (language_name, percentage) in enumerate(languages):
                  y_pos = TOP_MARGIN + 20 + (i * (BAR_HEIGHT + BAR_GAP))
                  bar_width = (percentage / max_percentage) * chart_width * 0.85
                  color = get_language_color(language_name)
                  
                  svg_parts.append(f'''
              <!-- {language_name} -->
              <text x="{LEFT_MARGIN - 12}" y="{y_pos + BAR_HEIGHT/2 + 1}" class="label" text-anchor="end">{language_name}</text>
              <rect x="{LEFT_MARGIN}" y="{y_pos}" width="{bar_width:.1f}" height="{BAR_HEIGHT}" rx="6" fill="{color}" opacity="0.9"/>
              <text x="{LEFT_MARGIN + bar_width + 10}" y="{y_pos + BAR_HEIGHT/2 + 1}" class="value">{percentage:.1f}%</text>''')
              
              svg_parts.append(f'''
          
          <!-- Footer -->
          <text x="{WIDTH - 32}" y="{HEIGHT - 24}" class="footer" text-anchor="end">Auto-generated from all repositories</text>
          </svg>''')
              
              return ''.join(svg_parts)

          def main():
              """Main execution function."""
              print("Fetching language data from GitHub repositories...")
              language_data = fetch_language_data()
              
              if not language_data:
                  print("No language data found. Creating placeholder SVG.")
                  svg_content = generate_svg([])
              else:
                  print(f"Found {len(language_data)} languages. Processing data...")
                  for lang, size in sorted(language_data.items(), key=lambda x: x[1], reverse=True)[:10]:
                      print(f"  {lang}: {size:,} bytes")
                  processed_languages = process_language_data(language_data)
                  print(f"Generating chart for {len(processed_languages)} languages.")
                  svg_content = generate_svg(processed_languages)
              
              with open("languages.svg", "w", encoding="utf-8") as f:
                  f.write(svg_content)
              
              print("Successfully generated languages.svg")

          if __name__ == "__main__":
              main()
          EOF

      - name: Commit and Push Changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add languages.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update programming languages chart"
            git push
            echo "Successfully updated languages.svg"
          fi