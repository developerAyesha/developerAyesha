<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<defs>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1"/>
    </filter>
</defs>
<style>
    :root {
        --bg: #ffffff;
        --card-bg: #f8fafc;
        --text: #1e1b4b;
        --text-muted: #6b7280;
        --border: #e5e7eb;
        --accent: #6366f1;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0f0f23;
            --card-bg: #1a1a3e;
            --text: #e4e4f0;
            --text-muted: #9ca3af;
            --border: #2d2d5a;
            --accent: #818cf8;
        }
    }
    text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .title {
        font-weight: 600;
        font-size: 18px;
        fill: var(--text);
    }
    .label {
        font-size: 13px;
        font-weight: 500;
        fill: var(--text);
    }
    .value {
        font-size: 12px;
        font-weight: 600;
        fill: var(--text);
    }
    .footer {
        font-size: 11px;
        fill: var(--text-muted);
    }
</style>

<!-- Background -->
<rect x="0" y="0" width="900" height="420" rx="16" fill="var(--bg)"/>
<rect x="16" y="16" width="868" height="388" rx="12" fill="var(--card-bg)" filter="url(#shadow)"/>

<!-- Title -->
<text x="140" y="48" class="title">Programming Languages</text>

<!-- TypeScript -->
<text x="128" y="95" class="label" text-anchor="end">TypeScript</text>
<rect x="140" y="80" width="520" height="28" rx="6" fill="#3178c6" opacity="0.9"/>
<text x="670" y="95" class="value">42.5%</text>

<!-- JavaScript -->
<text x="128" y="139" class="label" text-anchor="end">JavaScript</text>
<rect x="140" y="124" width="318" height="28" rx="6" fill="#f7df1e" opacity="0.9"/>
<text x="468" y="139" class="value">26.0%</text>

<!-- Python -->
<text x="128" y="183" class="label" text-anchor="end">Python</text>
<rect x="140" y="168" width="183" height="28" rx="6" fill="#3776ab" opacity="0.9"/>
<text x="333" y="183" class="value">15.0%</text>

<!-- Go -->
<text x="128" y="227" class="label" text-anchor="end">Go</text>
<rect x="140" y="212" width="73" height="28" rx="6" fill="#00add8" opacity="0.9"/>
<text x="223" y="227" class="value">6.0%</text>

<!-- Rust -->
<text x="128" y="271" class="label" text-anchor="end">Rust</text>
<rect x="140" y="256" width="49" height="28" rx="6" fill="#dea584" opacity="0.9"/>
<text x="199" y="271" class="value">4.0%</text>

<!-- Java -->
<text x="128" y="315" class="label" text-anchor="end">Java</text>
<rect x="140" y="300" width="37" height="28" rx="6" fill="#ed8b00" opacity="0.9"/>
<text x="187" y="315" class="value">3.0%</text>

<!-- Other -->
<text x="128" y="359" class="label" text-anchor="end">Other</text>
<rect x="140" y="344" width="43" height="28" rx="6" fill="#6b7280" opacity="0.9"/>
<text x="193" y="359" class="value">3.5%</text>

<!-- Footer -->
<text x="868" y="396" class="footer" text-anchor="end">Auto-generated from all repositories</text>
</svg>
